<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aquiles Guzmán Alonso · CEO · Emboobate</title>
<meta name="description" content="Tarjeta de presentación de Aquiles Guzmán Alonso, CEO de Emboobate.">
<meta property="og:image" content="frente.png">
<link rel="stylesheet" href="estilo.css">
<script src="datos.js"></script>
</head>
<body>
<main>
  <div class="escena" id="escena">
    <div class="tarjeta" id="tarjeta" role="group" aria-label="Tarjeta de presentación">

        <img src="frente.png" alt="Emboobate — Prohibido pensarlo tanto. Aquiles Guzmán Alonso" draggable="false">
        <p class="firma"><span id="nombre"></span> · <span id="puesto"></span></p>
      </section>
      <section class="cara reverso" aria-label="Reverso">
        <h2>ESCANÉAME</h2>
        <img class="qr" src="qr.svg" alt="Código QR" draggable="false">
        <nav class="links" id="links" aria-label="Links"></nav>
      </section>
    </div>
  </div>
  <button class="voltear" id="voltear" type="button" aria-pressed="false">Girar tarjeta ↻</button>
  <p class="pista">También puedes arrastrarla hacia un lado o tocarla</p>
</main>
<script src="app.js"></script>

</html>
